name: Update EuroLeague data

on:
  schedule:
    # Once per round: Saturday 06:00 UTC, after the Thursday/Friday games of the round
    - cron: "0 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull schedule and box scores, rebuild hub.json
        run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "euroleague-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
