name: Update EuroLeague data

# Checks every morning at 06:17 UTC; updates the stats only when a round has
# been completed (the morning after its last game). Can also be run by hand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Is a round complete?
        id: check
        run: python scripts/auto.py stats
      - name: Pull schedule and box scores, rebuild hub.json
        if: github.event_name != 'schedule' || steps.check.outputs.due == 'true'
        run: |
          python scripts/update_data.py
          python scripts/auto.py stats --mark "${{ steps.check.outputs.slot }}"
      - name: Commit if changed
        if: github.event_name != 'schedule' || steps.check.outputs.due == 'true'
        run: |
          git config user.name "euroleague-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
