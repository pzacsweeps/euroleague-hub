name: Update EuroLeague data

# Manual refresh of the schedule and stats. The automatic stats update lives in
# morning.yml (runs the morning after a round is completed).
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hub-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull schedule and box scores, rebuild hub.json
        run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "euroleague-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
