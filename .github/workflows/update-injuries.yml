name: Update injuries

# Pre-game: on Tue-Fri afternoons/evenings a quick check (no network calls) looks
# at today's saved first tip-off time and pulls the injury report once, about
# 30 minutes before it. Can also be run by hand at any time.
on:
  schedule:
    - cron: "4,19,34,49 14-19 * * 2-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hub-data
  cancel-in-progress: false

jobs:
  injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is the pre-game update due?
        id: check
        if: github.event_name == 'schedule'
        run: python3 scripts/auto.py pregame
      - name: Pull the BasketNews injury report
        if: github.event_name != 'schedule' || steps.check.outputs.due == 'true'
        run: |
          python3 scripts/update_injuries.py
          python3 scripts/auto.py injuries --mark "${{ github.event_name == 'schedule' && 'pregame' || 'manual' }}"
      - name: Commit if changed
        run: |
          git config user.name "euroleague-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Injury update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
