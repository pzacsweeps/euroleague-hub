name: Update injuries

# Run by hand from the Actions tab (or the GitHub mobile app) before a game day or a round.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull the BasketNews injury report
        run: python scripts/update_injuries.py
      - name: Commit if changed
        run: |
          git config user.name "euroleague-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/injuries.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Injury update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
